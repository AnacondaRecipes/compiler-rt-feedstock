# Windows: keep consistent with llvmdev and clangdev
c_compiler:
  - clang_bootstrap  # [osx]
  - vs2022           # [win]
cxx_compiler:
  - clang_bootstrap  # [osx]
  - vs2022           # [win]

# macOS builds with the released clang_bootstrap (LLVM 22); release-first order of the LLVM 23 chain
c_compiler_version:    # [osx]
  - 22.1.2             # [osx]
cxx_compiler_version:  # [osx]
  - 22.1.2             # [osx]
